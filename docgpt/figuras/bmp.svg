<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Qué hay antes del primer píxel</title><desc id="desc">La paleta del archivo ocupa 1024 bytes; la paleta convertida para el DAC ocupa 768.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Qué hay antes del primer píxel</text><text x="40" y="105" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">BMP de 320 × 200 usado por el proyecto</text><rect x="40" y="145" width="200" height="120" rx="9" fill="#d7a33c" stroke="none" stroke-width="2" /><text x="140.0" y="192" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">54 bytes</text><text x="140.0" y="230" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="normal">cabeceras</text><rect x="250" y="145" width="270" height="120" rx="9" fill="#148f82" stroke="none" stroke-width="2" /><text x="385.0" y="192" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">1024 bytes</text><text x="385.0" y="230" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="normal">256 entradas BGR0</text><rect x="530" y="145" width="470" height="120" rx="9" fill="#173548" stroke="none" stroke-width="2" /><text x="765.0" y="192" font-size="26" fill="#ffffff" text-anchor="middle" font-weight="bold">64000 bytes</text><text x="765.0" y="230" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="normal">píxeles + filas invertidas</text><text x="40" y="310" font-size="20" fill="#243746" text-anchor="start" font-weight="normal">0</text><text x="250" y="310" font-size="20" fill="#243746" text-anchor="start" font-weight="normal">54</text><text x="530" y="310" font-size="20" fill="#243746" text-anchor="start" font-weight="normal">1078</text><text x="995" y="310" font-size="20" fill="#243746" text-anchor="end" font-weight="normal">65078</text><text x="50" y="390" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">Archivo: BGR0 (4 bytes/entrada) → memoria DAC: 3 bytes/entrada.</text><text x="50" y="435" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">Offset fijo 1078: contrato de estos recursos, no de cualquier BMP.</text></g></svg>