<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Construir en RAM, presentar en VGA</title><desc id="desc">El buffer de composición permanece de 320 × 200 incluso al ampliar el mundo.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Construir en RAM, presentar en VGA</text><rect x="40" y="115" width="250" height="120" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="165.0" y="151" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Fondo visible</text><text x="165.0" y="183" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">200 filas × 320 bytes</text><line x1="295" y1="175" x2="355" y2="175" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="365" y="115" width="300" height="120" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="515.0" y="151" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Buffer de pantalla</text><text x="515.0" y="183" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">fondo + sprites + HUD</text><line x1="670" y1="175" x2="735" y2="175" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="745" y="115" width="255" height="120" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="872.5" y="151" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">VGA A000:0000</text><text x="872.5" y="183" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">64000 bytes</text><text x="380" y="280" font-size="22" fill="#148f82" text-anchor="start" font-weight="normal">↑ tanques, balas, cifras</text><text x="60" y="380" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">La siguiente imagen se compone sin borrar delante del jugador.</text><text x="60" y="425" font-size="21" fill="#243746" text-anchor="start" font-weight="normal">El retrazo ayuda a presentar; no garantiza que cualquier copia quepa en él.</text></g></svg>