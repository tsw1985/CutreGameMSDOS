<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Una casilla de exceso, una casilla de corrección</title><desc id="desc">Con pantalla de diez y márgenes de tres, la marca de una casilla puede ocupar 3 a 6.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Una casilla de exceso, una casilla de corrección</text><text x="80" y="112" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">Margen: 3</text><text x="505" y="112" font-size="25" fill="#148f82" text-anchor="middle" font-weight="bold">Zona libre: 3..6</text><text x="965" y="112" font-size="22" fill="#243746" text-anchor="end" font-weight="normal">Margen: 3</text><rect x="80" y="145" width="81" height="80" rx="4" fill="#e3e9eb" stroke="none" stroke-width="2" /><text x="120" y="194" font-size="29" fill="#243746" text-anchor="middle" font-weight="normal">0</text><rect x="167" y="145" width="81" height="80" rx="4" fill="#e3e9eb" stroke="none" stroke-width="2" /><text x="207" y="194" font-size="29" fill="#243746" text-anchor="middle" font-weight="normal">1</text><rect x="254" y="145" width="81" height="80" rx="4" fill="#e3e9eb" stroke="none" stroke-width="2" /><text x="294" y="194" font-size="29" fill="#243746" text-anchor="middle" font-weight="normal">2</text><rect x="341" y="145" width="81" height="80" rx="4" fill="#c9e9df" stroke="none" stroke-width="2" /><text x="381" y="194" font-size="29" fill="#243746" text-anchor="middle" font-weight="normal">3</text><rect x="428" y="145" width="81" height="80" rx="4" fill="#c9e9df" stroke="none" stroke-width="2" /><text x="468" y="194" font-size="29" fill="#243746" text-anchor="middle" font-weight="normal">4</text><rect x="515" y="145" width="81" height="80" rx="4" fill="#c9e9df" stroke="none" stroke-width="2" /><text x="555" y="194" font-size="29" fill="#243746" text-anchor="middle" font-weight="normal">5</text><rect x="602" y="145" width="81" height="80" rx="4" fill="#c9e9df" stroke="none" stroke-width="2" /><text x="642" y="194" font-size="29" fill="#243746" text-anchor="middle" font-weight="normal">6</text><rect x="689" y="145" width="81" height="80" rx="4" fill="#e3e9eb" stroke="none" stroke-width="2" /><text x="729" y="194" font-size="29" fill="#243746" text-anchor="middle" font-weight="normal">7</text><rect x="776" y="145" width="81" height="80" rx="4" fill="#e3e9eb" stroke="none" stroke-width="2" /><text x="816" y="194" font-size="29" fill="#243746" text-anchor="middle" font-weight="normal">8</text><rect x="863" y="145" width="81" height="80" rx="4" fill="#e3e9eb" stroke="none" stroke-width="2" /><text x="903" y="194" font-size="29" fill="#243746" text-anchor="middle" font-weight="normal">9</text><rect x="50" y="300" width="360" height="100" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="230.0" y="336" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Antes: mundo 11, cámara 4</text><text x="230.0" y="368" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">Pantalla 7: sobra una casilla</text><line x1="420" y1="350" x2="600" y2="350" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="615" y="300" width="375" height="100" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="802.5" y="336" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Después: cámara 5</text><text x="802.5" y="368" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">Mundo 11 → pantalla 6</text><text x="80" y="460" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">Solo cambia la cámara. El objetivo conserva su coordenada de mundo.</text></g></svg>