<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">No confundir el socket IPX con el puerto UDP</title><desc id="desc">El encapsulado del emulador no cambia la API IPX que utiliza el juego DOS.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">No confundir el socket IPX con el puerto UDP</text><rect x="50" y="100" width="290" height="110" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="195.0" y="136" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Juego A</text><text x="195.0" y="168" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">socket IPX 0x869C</text><rect x="700" y="100" width="290" height="110" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="845.0" y="136" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Juego B</text><text x="845.0" y="168" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">socket IPX 0x869C</text><rect x="50" y="300" width="290" height="110" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="195.0" y="336" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">DOSBox A</text><text x="195.0" y="368" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">transporte UDP</text><rect x="700" y="300" width="290" height="110" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="845.0" y="336" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">DOSBox B</text><text x="845.0" y="368" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">puerto 5213</text><line x1="195" y1="220" x2="195" y2="285" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><line x1="845" y1="285" x2="845" y2="220" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><line x1="355" y1="355" x2="685" y2="355" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><text x="515" y="315" font-size="22" fill="#243746" text-anchor="middle" font-weight="normal">red anfitriona</text><text x="80" y="465" font-size="21" fill="#243746" text-anchor="start" font-weight="normal">Dentro del datagrama: cabecera IPX de 30 bytes + envoltorio de 12 + datos.</text></g></svg>