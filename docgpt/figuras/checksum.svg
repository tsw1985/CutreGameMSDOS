<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Comparar el mismo frame, aunque llegue más tarde</title><desc id="desc">La etiqueta evita comparar un checksum nuevo con otro antiguo que ocupa la misma casilla del anillo.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Comparar el mismo frame, aunque llegue más tarde</text><rect x="40" y="110" width="270" height="140" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="175.0" y="146" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Estado local N=412</text><text x="175.0" y="178" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">checksum 51230</text><text x="175.0" y="204" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">casilla 412 &amp; 63 = 28</text><rect x="730" y="110" width="270" height="140" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="865.0" y="146" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Mensaje remoto</text><text x="865.0" y="178" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">frame 412</text><text x="865.0" y="204" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">checksum 51237</text><line x1="725" y1="180" x2="325" y2="180" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="355" y="325" width="330" height="100" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="520.0" y="361" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Comparación válida</text><text x="520.0" y="393" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">las etiquetas de frame coinciden</text><line x1="180" y1="260" x2="400" y2="315" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><line x1="865" y1="260" x2="640" y2="315" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="465" font-size="21" fill="#243746" text-anchor="start" font-weight="normal">Una diferencia detecta divergencia en el frame comparado; no localiza su origen.</text></g></svg>