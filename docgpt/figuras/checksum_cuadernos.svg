<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Un resumen pequeño puede detectar diferencias</title><desc id="desc">La receta multiplica manzanas por tres y peras por cinco; dos inventarios distintos pueden coincidir.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Un resumen pequeño puede detectar diferencias</text><rect x="30" y="115" width="300" height="145" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="180.0" y="151" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">A: (4,7)</text><text x="180.0" y="183" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">4 × 3 + 7 × 5</text><text x="180.0" y="209" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">12 + 35 = 47</text><rect x="370" y="115" width="300" height="145" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="520.0" y="151" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">B: (5,7)</text><text x="520.0" y="183" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">5 × 3 + 7 × 5</text><text x="520.0" y="209" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">15 + 35 = 50</text><rect x="710" y="115" width="300" height="145" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="860.0" y="151" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">C: (9,4)</text><text x="860.0" y="183" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">9 × 3 + 4 × 5</text><text x="860.0" y="209" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">27 + 20 = 47</text><text x="45" y="335" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">A frente a B: 47 ≠ 50. La comprobación encuentra una diferencia.</text><text x="45" y="390" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">A frente a C: 47 = 47. Los datos distintos producen una colisión.</text><text x="45" y="452" font-size="25" fill="#148f82" text-anchor="start" font-weight="bold">Mismos pesos y mismo recuento en ambos cuadernos.</text></g></svg>