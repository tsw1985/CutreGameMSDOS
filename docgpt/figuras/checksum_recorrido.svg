<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Calcular ahora, comparar el mismo frame después</title><desc id="desc">El resultado se etiqueta con el frame calculado; la casilla y su etiqueta protegen la comparación tardía.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Calcular ahora, comparar el mismo frame después</text><rect x="30" y="115" width="285" height="150" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="172.5" y="151" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">A termina frame 29</text><text x="172.5" y="183" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">Calcula 25188</text><text x="172.5" y="209" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">Guarda (29,25188)</text><line x1="325" y1="190" x2="365" y2="190" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="375" y="115" width="285" height="150" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="517.5" y="151" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">A comienza frame 30</text><text x="517.5" y="183" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">Envía el pendiente</text><text x="517.5" y="209" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">(29,25188)</text><line x1="670" y1="190" x2="710" y2="190" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="720" y="115" width="290" height="150" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="865.0" y="151" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">B recibe más tarde</text><text x="865.0" y="183" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">Busca su frame 29</text><text x="865.0" y="209" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">Compara los valores</text><text x="45" y="340" font-size="25" fill="#148f82" text-anchor="start" font-weight="bold">La etiqueta sigue siendo 29 aunque el paquete viaje después.</text><text x="45" y="405" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">Casilla = frame &amp; 63: tanto 29 como 93 usan la casilla 29.</text><text x="45" y="453" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">Si la etiqueta guardada ya es 93, no se compara con el recibido de 29.</text></g></svg>