<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Un origen negativo todavía puede dejar píxeles visibles</title><desc id="desc">La intersección conserva 126 píxeles geométricos, antes de descartar los transparentes.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Un origen negativo todavía puede dejar píxeles visibles</text><rect x="100" y="110" width="360" height="300" rx="0" fill="#dce8e9" stroke="#173548" stroke-width="2" /><rect x="28" y="78" width="144" height="144" rx="0" fill="#f5d2c8" stroke="#d45d46" stroke-width="2" /><rect x="100" y="110" width="72" height="112" rx="0" fill="#148f82" stroke="none" stroke-width="2" /><text x="220" y="150" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">PANTALLA</text><text x="25" y="65" font-size="21" fill="#d45d46" text-anchor="start" font-weight="normal">sprite (−9,−4)</text><text x="520" y="140" font-size="24" fill="#243746" text-anchor="start" font-weight="bold">Sprite original: 18 × 18</text><text x="520" y="205" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">Columnas visibles: 9..17</text><text x="520" y="260" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">Filas visibles: 4..17</text><text x="520" y="320" font-size="29" fill="#148f82" text-anchor="start" font-weight="bold">Resultado: 9 × 14</text><text x="60" y="465" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">Se recorta el dibujo. No se cambia la posición del objeto en el mundo.</text></g></svg>