<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Del archivo C al juego que lee recursos</title><desc id="desc">Los recursos se leen en ejecución; no se convierten en objetos durante el enlace.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Del archivo C al juego que lee recursos</text><rect x="35" y="110" width="260" height="120" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="165.0" y="146" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Fuentes .c / .asm</text><text x="165.0" y="178" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">instrucciones legibles</text><rect x="390" y="110" width="260" height="120" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="520.0" y="146" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Objetos .obj</text><text x="520.0" y="178" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">código de cada módulo</text><rect x="745" y="110" width="260" height="120" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="875.0" y="146" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">bin/game.exe</text><text x="875.0" y="178" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">programa enlazado</text><line x1="300" y1="170" x2="380" y2="170" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><line x1="655" y1="170" x2="735" y2="170" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><text x="336" y="100" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">compilar</text><text x="696" y="100" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">enlazar</text><rect x="390" y="320" width="260" height="100" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="520.0" y="356" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">res: BMP y WAV</text><text x="520.0" y="388" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">datos leídos al ejecutar</text><line x1="655" y1="368" x2="870" y2="240" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="465" font-size="21" fill="#243746" text-anchor="start" font-weight="normal">El directorio actual determina cómo se resuelven las rutas relativas.</text></g></svg>