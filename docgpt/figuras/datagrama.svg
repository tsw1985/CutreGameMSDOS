<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Descubrir una pareja y enviar mensajes</title><desc id="desc">El descubrimiento establece una identidad y una dirección; los datagramas siguen necesitando reglas de uso.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Descubrir una pareja y enviar mensajes</text><rect x="50" y="90" width="260" height="90" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="180.0" y="126" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Equipo A</text><rect x="730" y="90" width="260" height="90" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="860.0" y="126" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Equipo B</text><line x1="315" y1="220" x2="720" y2="220" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><text x="515" y="200" font-size="22" fill="#243746" text-anchor="middle" font-weight="normal">HELLO por broadcast</text><line x1="725" y1="300" x2="320" y2="300" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><text x="515" y="280" font-size="22" fill="#243746" text-anchor="middle" font-weight="normal">HELLO_ACK</text><line x1="315" y1="380" x2="720" y2="380" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><text x="515" y="360" font-size="22" fill="#243746" text-anchor="middle" font-weight="normal">Datos para el peer identificado</text><text x="65" y="465" font-size="21" fill="#243746" text-anchor="start" font-weight="normal">Envío lanzado no significa entrega confirmada: el protocolo superior decide.</text></g></svg>