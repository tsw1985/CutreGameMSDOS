<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Detectar la transición de libre a pulsada</title><desc id="desc">La secuencia tiene dos flancos de subida, pero solo uno se acepta si la primera bala sigue activa.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Detectar la transición de libre a pulsada</text><text x="35" y="105" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">Estado de FIRE por frame</text><rect x="45" y="145" width="170" height="85" rx="9" fill="#e0eaed" stroke="none" stroke-width="2" /><text x="130" y="198" font-size="30" fill="#243746" text-anchor="middle" font-weight="normal">0</text><text x="130" y="270" font-size="21" fill="#243746" text-anchor="middle" font-weight="normal">—</text><rect x="235" y="145" width="170" height="85" rx="9" fill="#148f82" stroke="none" stroke-width="2" /><text x="320" y="198" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="normal">1</text><text x="320" y="270" font-size="21" fill="#d45d46" text-anchor="middle" font-weight="normal">flanco</text><rect x="425" y="145" width="170" height="85" rx="9" fill="#148f82" stroke="none" stroke-width="2" /><text x="510" y="198" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="normal">1</text><text x="510" y="270" font-size="21" fill="#243746" text-anchor="middle" font-weight="normal">—</text><rect x="615" y="145" width="170" height="85" rx="9" fill="#e0eaed" stroke="none" stroke-width="2" /><text x="700" y="198" font-size="30" fill="#243746" text-anchor="middle" font-weight="normal">0</text><text x="700" y="270" font-size="21" fill="#243746" text-anchor="middle" font-weight="normal">—</text><rect x="805" y="145" width="170" height="85" rx="9" fill="#148f82" stroke="none" stroke-width="2" /><text x="890" y="198" font-size="30" fill="#ffffff" text-anchor="middle" font-weight="normal">1</text><text x="890" y="270" font-size="21" fill="#d45d46" text-anchor="middle" font-weight="normal">flanco</text><text x="55" y="350" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">Un flanco pide disparar. Una bala ya activa puede impedir el nuevo disparo.</text><text x="55" y="420" font-size="27" fill="#148f82" text-anchor="start" font-weight="bold">Pulsación mantenida ≠ una bala nueva por cada frame.</text></g></svg>