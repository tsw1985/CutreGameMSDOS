<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Dos mitades para producir y consumir audio</title><desc id="desc">A 44100 muestras por segundo, una mitad de 2048 muestras dura aproximadamente 46,44 ms.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Dos mitades para producir y consumir audio</text><text x="45" y="110" font-size="25" fill="#243746" text-anchor="start" font-weight="bold">Un bloque DMA de 4096 bytes</text><rect x="45" y="145" width="460" height="95" rx="9" fill="#148f82" stroke="none" stroke-width="2" /><rect x="505" y="145" width="460" height="95" rx="9" fill="#173548" stroke="none" stroke-width="2" /><text x="275" y="200" font-size="25" fill="#ffffff" text-anchor="middle" font-weight="normal">Mitad 0 · 2048 bytes</text><text x="735" y="200" font-size="25" fill="#ffffff" text-anchor="middle" font-weight="normal">Mitad 1 · 2048 bytes</text><line x1="60" y1="325" x2="970" y2="325" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><line x1="65" y1="310" x2="65" y2="340" stroke="#243746" stroke-width="2" stroke-dasharray=""/><text x="65" y="285" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">0 ms</text><text x="65" y="375" font-size="18" fill="#243746" text-anchor="start" font-weight="normal">lee mitad 0</text><line x1="505" y1="310" x2="505" y2="340" stroke="#243746" stroke-width="2" stroke-dasharray=""/><text x="505" y="285" font-size="22" fill="#243746" text-anchor="middle" font-weight="normal">46,44 ms</text><text x="505" y="375" font-size="18" fill="#243746" text-anchor="start" font-weight="normal">IRQ → lee mitad 1</text><line x1="950" y1="310" x2="950" y2="340" stroke="#243746" stroke-width="2" stroke-dasharray=""/><text x="950" y="285" font-size="22" fill="#243746" text-anchor="middle" font-weight="normal">92,88 ms</text><text x="950" y="375" font-size="18" fill="#243746" text-anchor="end" font-weight="normal">vuelve a mitad 0</text><text x="70" y="450" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">Tras el aviso, rellena la mitad terminada mientras la tarjeta lee la otra.</text></g></svg>