<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Unas reglas, dos fuentes de entrada</title><desc id="desc">Las entradas se normalizan para aplicar las mismas reglas a ambos jugadores.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Unas reglas, dos fuentes de entrada</text><rect x="45" y="100" width="260" height="120" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="175.0" y="136" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Jugador 1</text><text x="175.0" y="168" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">flechas + disparo</text><rect x="45" y="300" width="260" height="120" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="175.0" y="336" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Jugador 2</text><text x="175.0" y="368" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">WASD + disparo</text><rect x="440" y="190" width="300" height="145" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="590.0" y="226" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Aplicar reglas</text><text x="590.0" y="258" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">paredes + tanque rival</text><text x="590.0" y="284" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">posición + dirección</text><line x1="310" y1="160" x2="430" y2="230" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><line x1="310" y1="360" x2="430" y2="290" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><text x="785" y="265" font-size="27" fill="#148f82" text-anchor="start" font-weight="bold">MUNDO</text><text x="80" y="465" font-size="21" fill="#243746" text-anchor="start" font-weight="normal">La colisión entre tanques usa una caja interior; las balas usan otro criterio.</text></g></svg>