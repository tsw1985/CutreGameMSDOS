<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">De teclas mantenidas a una máscara de órdenes</title><desc id="desc">El mismo byte de entrada puede obtenerse del teclado o recibirse por red.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">De teclas mantenidas a una máscara de órdenes</text><text x="40" y="110" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">Cinco bits describen una orden; varias teclas pueden estar activas.</text><rect x="35" y="160" width="186" height="115" rx="9" fill="#d4efea" stroke="none" stroke-width="2" /><text x="128.0" y="196" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">UP</text><text x="128.0" y="228" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">0x01</text><rect x="237" y="160" width="186" height="115" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="330.0" y="196" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">DOWN</text><text x="330.0" y="228" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">0x02</text><rect x="439" y="160" width="186" height="115" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="532.0" y="196" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">LEFT</text><text x="532.0" y="228" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">0x04</text><rect x="641" y="160" width="186" height="115" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="734.0" y="196" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">RIGHT</text><text x="734.0" y="228" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">0x08</text><rect x="843" y="160" width="186" height="115" rx="9" fill="#d4efea" stroke="none" stroke-width="2" /><text x="936.0" y="196" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">FIRE</text><text x="936.0" y="228" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">0x10</text><text x="80" y="355" font-size="31" fill="#148f82" text-anchor="start" font-weight="bold">UP | FIRE = 0x01 | 0x10 = 0x11</text><text x="80" y="420" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">La prioridad de movimiento se decide después de leer la combinación.</text></g></svg>