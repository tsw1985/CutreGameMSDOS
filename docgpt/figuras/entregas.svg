<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Del primer píxel a una partida completa</title><desc id="desc">La reconstrucción se organiza por comportamientos verificables, no por cantidad de archivos copiados.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Del primer píxel a una partida completa</text><rect x="40" y="105" width="225" height="120" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="152.5" y="141" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">1. Imagen</text><text x="152.5" y="173" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">VGA + BMP</text><rect x="290" y="105" width="225" height="120" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="402.5" y="141" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">2. Tanque</text><text x="402.5" y="173" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">entrada + estado</text><rect x="540" y="105" width="225" height="120" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="652.5" y="141" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">3. Duelo</text><text x="652.5" y="173" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">paredes + disparos</text><rect x="790" y="105" width="225" height="120" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="902.5" y="141" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">4. Audio</text><text x="902.5" y="173" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">mezcla + streaming</text><rect x="40" y="275" width="225" height="120" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="152.5" y="311" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">5. Red</text><text x="152.5" y="343" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">entradas por frame</text><rect x="290" y="275" width="225" height="120" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="402.5" y="311" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">6. Mundo</text><text x="402.5" y="343" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">mapa + cámara</text><rect x="540" y="275" width="225" height="120" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="652.5" y="311" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">7. Presentación</text><text x="652.5" y="343" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">radar + fundidos</text><rect x="790" y="275" width="225" height="120" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="902.5" y="311" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">8. Intro</text><text x="902.5" y="343" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">efectos + limpieza</text><text x="60" y="460" font-size="21" fill="#243746" text-anchor="start" font-weight="normal">Cada entrega necesita un resultado observable y un caso de prueba reproducible.</text></g></svg>