<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Estado persistente y cambios de orientación</title><desc id="desc">Una pose visual no sustituye la posición ni la orientación lógica del tanque.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Estado persistente y cambios de orientación</text><rect x="35" y="110" width="280" height="150" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="175.0" y="146" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Tanque</text><text x="175.0" y="178" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">posición (x,y)</text><text x="175.0" y="204" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">dirección + pose</text><rect x="380" y="110" width="280" height="150" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="520.0" y="146" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Orden de avance</text><text x="520.0" y="178" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">calcular candidato</text><text x="520.0" y="204" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">consultar obstáculos</text><rect x="725" y="110" width="280" height="150" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="865.0" y="146" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Estado siguiente</text><text x="865.0" y="178" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">aceptar o conservar</text><text x="865.0" y="204" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">animar según la regla</text><line x1="320" y1="180" x2="370" y2="180" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><line x1="665" y1="180" x2="715" y2="180" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><text x="60" y="365" font-size="25" fill="#243746" text-anchor="start" font-weight="normal">El dibujo lee el estado; no decide si el movimiento fue válido.</text><text x="60" y="425" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">Orientación, pose de animación y posición son datos diferentes.</text></g></svg>