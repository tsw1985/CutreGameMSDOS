<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Tres familias de trucos gráficos</title><desc id="desc">Elegir el trabajo por paleta, tramo o píxel permite entender el coste de cada efecto.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Tres familias de trucos gráficos</text><rect x="35" y="120" width="300" height="150" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="185.0" y="156" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Cambiar interpretación</text><text x="185.0" y="188" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">cycle</text><text x="185.0" y="214" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">los índices no se mueven</text><rect x="370" y="120" width="300" height="150" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="520.0" y="156" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Mover tramos</text><text x="520.0" y="188" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">scroll · wobble · ripple</text><text x="520.0" y="214" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">filas divididas en copias</text><rect x="705" y="120" width="300" height="150" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="855.0" y="156" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Buscar muestras</text><text x="855.0" y="188" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">mosaic · zoom · rotozoom</text><text x="855.0" y="214" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">un origen por región o píxel</text><text x="80" y="360" font-size="24" fill="#243746" text-anchor="start" font-weight="normal">Todas comparten tiempo, teclado, sonido, memoria y presentación.</text><text x="80" y="425" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">El efecto decide la transformación; el reproductor organiza la secuencia.</text></g></svg>