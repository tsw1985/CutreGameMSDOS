<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Blinds · an opening grows from the centre</title><desc id="desc">Widen the product to long before multiplying by 160 on Turbo C.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Blinds · an opening grows from the centre</text><rect x="40" y="105" width="700" height="72" rx="0" fill="#173548" stroke="none" stroke-width="2" /><rect x="390.0" y="105" width="0.0" height="72" rx="0" fill="#148f82" stroke="none" stroke-width="2" /><text x="775" y="148" font-size="24" fill="#243746" text-anchor="start" font-weight="normal">half=0</text><rect x="40" y="210" width="700" height="72" rx="0" fill="#173548" stroke="none" stroke-width="2" /><rect x="215.0" y="210" width="350.0" height="72" rx="0" fill="#148f82" stroke="none" stroke-width="2" /><text x="775" y="253" font-size="24" fill="#243746" text-anchor="start" font-weight="normal">half=80</text><rect x="40" y="315" width="700" height="72" rx="0" fill="#173548" stroke="none" stroke-width="2" /><rect x="40.0" y="315" width="700.0" height="72" rx="0" fill="#148f82" stroke="none" stroke-width="2" /><text x="775" y="358" font-size="24" fill="#243746" text-anchor="start" font-weight="normal">half=160</text><text x="60" y="455" font-size="28" fill="#148f82" text-anchor="start" font-weight="bold">(160−half) + 2×half + (160−half) = 320</text></g></svg>