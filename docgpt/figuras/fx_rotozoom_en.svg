<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Rotozoom · intersect two valid intervals</title><desc id="desc">A source pixel must satisfy both the U and V bounds.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Rotozoom · intersect two valid intervals</text><rect x="80" y="100" width="490" height="300" rx="0" fill="#173548" stroke="none" stroke-width="2" /><polygon points="205,100 565,240 445,400 85,260" fill="#148f82"/><line x1="80" y1="250" x2="570" y2="250" stroke="#ffffff" stroke-width="3" stroke-dasharray=""/><text x="100" y="445" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">Row: black | valid samples | black</text><text x="630" y="145" font-size="24" fill="#243746" text-anchor="start" font-weight="normal">U allows: 2..8</text><text x="630" y="210" font-size="24" fill="#243746" text-anchor="start" font-weight="normal">V allows: 5..11</text><text x="630" y="280" font-size="28" fill="#148f82" text-anchor="start" font-weight="bold">Intersection: 5..8</text><text x="630" y="350" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">first = max(starts)</text><text x="630" y="405" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">last = min(ends)</text></g></svg>