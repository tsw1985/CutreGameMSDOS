<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Zoom · el paso es inverso a la ampliación</title><desc id="desc">El paso se expresa con ocho bits fraccionarios: 256 significa una muestra por píxel.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Zoom · el paso es inverso a la ampliación</text><rect x="35" y="120" width="300" height="190" rx="0" fill="#173548" stroke="none" stroke-width="2" /><rect x="35" y="120" width="300" height="190" rx="0" fill="#148f82" stroke="none" stroke-width="2" /><text x="185" y="225" font-size="35" fill="#ffffff" text-anchor="middle" font-weight="normal">2×</text><text x="185" y="365" font-size="25" fill="#243746" text-anchor="middle" font-weight="normal">step=128</text><rect x="375" y="120" width="300" height="190" rx="0" fill="#173548" stroke="none" stroke-width="2" /><rect x="375" y="120" width="300" height="190" rx="0" fill="#148f82" stroke="none" stroke-width="2" /><text x="525" y="225" font-size="35" fill="#ffffff" text-anchor="middle" font-weight="normal">1×</text><text x="525" y="365" font-size="25" fill="#243746" text-anchor="middle" font-weight="normal">step=256</text><rect x="715" y="120" width="300" height="190" rx="0" fill="#173548" stroke="none" stroke-width="2" /><rect x="790" y="167.5" width="150" height="95" rx="0" fill="#148f82" stroke="none" stroke-width="2" /><text x="865" y="225" font-size="35" fill="#ffffff" text-anchor="middle" font-weight="normal">0,5×</text><text x="865" y="365" font-size="25" fill="#243746" text-anchor="middle" font-weight="normal">step=512</text><text x="60" y="455" font-size="28" fill="#148f82" text-anchor="start" font-weight="bold">Paso de lectura mayor → imagen visible más pequeña.</text></g></svg>