<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Memoria segmentada: dirección y tamaño son problemas distintos</title><desc id="desc">Ampliar un resultado después de una multiplicación de 16 bits desbordada no la repara.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Memoria segmentada: dirección y tamaño son problemas distintos</text><text x="45" y="110" font-size="24" fill="#243746" text-anchor="start" font-weight="normal">Una misma dirección física admite varias parejas:</text><rect x="55" y="145" width="340" height="110" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="225.0" y="181" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">1000:0020</text><text x="225.0" y="213" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">0x1000 × 16 + 0x20</text><rect x="645" y="145" width="340" height="110" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="815.0" y="181" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">1002:0000</text><text x="815.0" y="213" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">0x1002 × 16 + 0x00</text><text x="520" y="212" font-size="42" fill="#148f82" text-anchor="middle" font-weight="normal">=</text><text x="520" y="325" font-size="36" fill="#148f82" text-anchor="middle" font-weight="bold">0x10020</text><text x="55" y="405" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">El puntero huge normaliza. El offset de mapa se calcula en 32 bits.</text><text x="55" y="455" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">Reserva grande + producto amplio + puntero adecuado: necesitas los tres.</text></g></svg>