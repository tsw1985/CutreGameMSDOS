<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">La música comienza después de las cargas</title><desc id="desc">La barrera reduce diferencias de arranque debidas a carga, pero no constituye un reloj de audio compartido.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">La música comienza después de las cargas</text><rect x="35" y="110" width="280" height="130" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="175.0" y="146" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Cargar mundo</text><text x="175.0" y="178" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">mapas + sprites + WAV</text><rect x="380" y="110" width="280" height="130" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="520.0" y="146" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Barrera de red</text><text x="520.0" y="178" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">ambos extremos participan</text><rect x="725" y="110" width="280" height="130" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="865.0" y="146" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Comenzar canción</text><text x="865.0" y="178" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">primer frame + fundido</text><line x1="320" y1="175" x2="370" y2="175" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><line x1="665" y1="175" x2="715" y2="175" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="55" y="315" width="930" height="115" rx="9" fill="#dcefeb" stroke="none" stroke-width="2" /><text x="80" y="358" font-size="23" fill="#148f82" text-anchor="start" font-weight="bold">La barrera está fuera de la condición «hay tarjeta de sonido».</text><text x="80" y="399" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">Un equipo silencioso sigue formando parte del protocolo compartido.</text></g></svg>