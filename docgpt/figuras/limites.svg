<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="530" viewBox="0 0 1040 530" role="img" aria-labelledby="title desc">
<title id="title">Cuatro extremos válidos de la ventana</title><desc id="desc">Restar el tamaño de pantalla al tamaño de mapa deja espacio para la ventana completa.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="530" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Cuatro extremos válidos de la ventana</text><rect x="35" y="90" width="220" height="140" rx="0" fill="#dce8e7" stroke="#173548" stroke-width="2" /><rect x="35.0" y="90.0" width="110" height="70" rx="0" fill="#96cfc0" stroke="#148f82" stroke-width="2" /><text x="275" y="130" font-size="19" fill="#243746" text-anchor="start" font-weight="normal">superior izquierda</text><text x="275" y="175" font-size="26" fill="#148f82" text-anchor="start" font-weight="bold">(0,0)</text><rect x="545" y="90" width="220" height="140" rx="0" fill="#dce8e7" stroke="#173548" stroke-width="2" /><rect x="655.0" y="90.0" width="110" height="70" rx="0" fill="#96cfc0" stroke="#148f82" stroke-width="2" /><text x="785" y="130" font-size="19" fill="#243746" text-anchor="start" font-weight="normal">superior derecha</text><text x="785" y="175" font-size="26" fill="#148f82" text-anchor="start" font-weight="bold">(320,0)</text><rect x="35" y="280" width="220" height="140" rx="0" fill="#dce8e7" stroke="#173548" stroke-width="2" /><rect x="35.0" y="350.0" width="110" height="70" rx="0" fill="#96cfc0" stroke="#148f82" stroke-width="2" /><text x="275" y="320" font-size="19" fill="#243746" text-anchor="start" font-weight="normal">inferior izquierda</text><text x="275" y="365" font-size="26" fill="#148f82" text-anchor="start" font-weight="bold">(0,200)</text><rect x="545" y="280" width="220" height="140" rx="0" fill="#dce8e7" stroke="#173548" stroke-width="2" /><rect x="655.0" y="350.0" width="110" height="70" rx="0" fill="#96cfc0" stroke="#148f82" stroke-width="2" /><text x="785" y="320" font-size="19" fill="#243746" text-anchor="start" font-weight="normal">inferior derecha</text><text x="785" y="365" font-size="26" fill="#148f82" text-anchor="start" font-weight="bold">(320,200)</text><text x="50" y="490" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">La esquina de cámara llega a (320,200), no al último píxel del mundo.</text></g></svg>