<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Enviar entradas futuras, simular entradas disponibles</title><desc id="desc">El retardo inicial permite que los mensajes lleguen antes del frame donde se necesitan.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Enviar entradas futuras, simular entradas disponibles</text><text x="35" y="102" font-size="25" fill="#243746" text-anchor="start" font-weight="bold">Retardo de entrada: 5 frames de simulación</text><rect x="50" y="145" width="94" height="75" rx="9" fill="#dce7e8" stroke="none" stroke-width="2" /><text x="97" y="190" font-size="21" fill="#243746" text-anchor="middle" font-weight="normal">N=0</text><text x="97" y="260" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">0</text><rect x="157" y="145" width="94" height="75" rx="9" fill="#dce7e8" stroke="none" stroke-width="2" /><text x="204" y="190" font-size="21" fill="#243746" text-anchor="middle" font-weight="normal">N=1</text><text x="204" y="260" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">0</text><rect x="264" y="145" width="94" height="75" rx="9" fill="#dce7e8" stroke="none" stroke-width="2" /><text x="311" y="190" font-size="21" fill="#243746" text-anchor="middle" font-weight="normal">N=2</text><text x="311" y="260" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">0</text><rect x="371" y="145" width="94" height="75" rx="9" fill="#dce7e8" stroke="none" stroke-width="2" /><text x="418" y="190" font-size="21" fill="#243746" text-anchor="middle" font-weight="normal">N=3</text><text x="418" y="260" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">0</text><rect x="478" y="145" width="94" height="75" rx="9" fill="#dce7e8" stroke="none" stroke-width="2" /><text x="525" y="190" font-size="21" fill="#243746" text-anchor="middle" font-weight="normal">N=4</text><text x="525" y="260" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">0</text><rect x="585" y="145" width="94" height="75" rx="9" fill="#148f82" stroke="none" stroke-width="2" /><text x="632" y="190" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="normal">N=5</text><text x="632" y="260" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">entrada</text><rect x="692" y="145" width="94" height="75" rx="9" fill="#148f82" stroke="none" stroke-width="2" /><text x="739" y="190" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="normal">N=6</text><text x="739" y="260" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">entrada</text><rect x="799" y="145" width="94" height="75" rx="9" fill="#148f82" stroke="none" stroke-width="2" /><text x="846" y="190" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="normal">N=7</text><text x="846" y="260" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">entrada</text><rect x="906" y="145" width="94" height="75" rx="9" fill="#148f82" stroke="none" stroke-width="2" /><text x="953" y="190" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="normal">N=8</text><text x="953" y="260" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">entrada</text><line x1="98" y1="330" x2="635" y2="330" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><text x="350" y="310" font-size="22" fill="#243746" text-anchor="middle" font-weight="normal">La tecla recogida en N=0 se aplica en N=5</text><text x="70" y="405" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">Cada paso necesita las entradas de ambos jugadores para ese mismo N.</text><text x="70" y="450" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">Las cámaras pueden diferir; el estado compartido por frame debe coincidir.</text></g></svg>