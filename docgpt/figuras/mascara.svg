<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Ocho preguntas de pared en un solo byte</title><desc id="desc">El píxel inicial usa el bit menos significativo; la escritura binaria habitual se muestra en orden inverso.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Ocho preguntas de pared en un solo byte</text><text x="35" y="100" font-size="24" fill="#243746" text-anchor="start" font-weight="normal">Paredes en X = 0, 3 y 7 de una fila de ocho píxeles</text><rect x="45" y="140" width="105" height="78" rx="9" fill="#148f82" stroke="none" stroke-width="2" /><text x="97" y="190" font-size="29" fill="#ffffff" text-anchor="middle" font-weight="normal">1</text><text x="97" y="260" font-size="19" fill="#243746" text-anchor="middle" font-weight="normal">bit 0</text><rect x="165" y="140" width="105" height="78" rx="9" fill="#dce7eb" stroke="none" stroke-width="2" /><text x="217" y="190" font-size="29" fill="#243746" text-anchor="middle" font-weight="normal">0</text><text x="217" y="260" font-size="19" fill="#243746" text-anchor="middle" font-weight="normal">bit 1</text><rect x="285" y="140" width="105" height="78" rx="9" fill="#dce7eb" stroke="none" stroke-width="2" /><text x="337" y="190" font-size="29" fill="#243746" text-anchor="middle" font-weight="normal">0</text><text x="337" y="260" font-size="19" fill="#243746" text-anchor="middle" font-weight="normal">bit 2</text><rect x="405" y="140" width="105" height="78" rx="9" fill="#148f82" stroke="none" stroke-width="2" /><text x="457" y="190" font-size="29" fill="#ffffff" text-anchor="middle" font-weight="normal">1</text><text x="457" y="260" font-size="19" fill="#243746" text-anchor="middle" font-weight="normal">bit 3</text><rect x="525" y="140" width="105" height="78" rx="9" fill="#dce7eb" stroke="none" stroke-width="2" /><text x="577" y="190" font-size="29" fill="#243746" text-anchor="middle" font-weight="normal">0</text><text x="577" y="260" font-size="19" fill="#243746" text-anchor="middle" font-weight="normal">bit 4</text><rect x="645" y="140" width="105" height="78" rx="9" fill="#dce7eb" stroke="none" stroke-width="2" /><text x="697" y="190" font-size="29" fill="#243746" text-anchor="middle" font-weight="normal">0</text><text x="697" y="260" font-size="19" fill="#243746" text-anchor="middle" font-weight="normal">bit 5</text><rect x="765" y="140" width="105" height="78" rx="9" fill="#dce7eb" stroke="none" stroke-width="2" /><text x="817" y="190" font-size="29" fill="#243746" text-anchor="middle" font-weight="normal">0</text><text x="817" y="260" font-size="19" fill="#243746" text-anchor="middle" font-weight="normal">bit 6</text><rect x="885" y="140" width="105" height="78" rx="9" fill="#148f82" stroke="none" stroke-width="2" /><text x="937" y="190" font-size="29" fill="#ffffff" text-anchor="middle" font-weight="normal">1</text><text x="937" y="260" font-size="19" fill="#243746" text-anchor="middle" font-weight="normal">bit 7</text><text x="70" y="345" font-size="31" fill="#148f82" text-anchor="start" font-weight="bold">1 + 8 + 128 = 137 = 0x89</text><text x="70" y="415" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">i = y × anchura + x    byte = i / 8    máscara = 1 &lt;&lt; (i % 8)</text><text x="70" y="460" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">Al escribir: OR. Al consultar: AND distinto de cero.</text></g></svg>