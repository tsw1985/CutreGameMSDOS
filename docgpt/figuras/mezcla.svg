<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Mezclar amplitudes y volver a unsigned</title><desc id="desc">Primero se centra y escala cada voz; después se suma, satura y devuelve el desplazamiento de 128.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Mezclar amplitudes y volver a unsigned</text><rect x="40" y="115" width="250" height="130" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="165.0" y="151" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Muestra A = 228</text><text x="165.0" y="183" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">228 − 128 = +100</text><rect x="40" y="285" width="250" height="130" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="165.0" y="321" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Muestra B = 208</text><text x="165.0" y="353" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">208 − 128 = +80</text><rect x="420" y="190" width="240" height="130" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="540.0" y="226" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Suma = +180</text><text x="540.0" y="258" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">limitar a +127</text><line x1="295" y1="180" x2="410" y2="230" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><line x1="295" y1="350" x2="410" y2="270" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="755" y="190" width="250" height="130" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="880.0" y="226" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Salida = 255</text><text x="880.0" y="258" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">127 + 128</text><line x1="665" y1="255" x2="745" y2="255" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="465" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">Con ambas voces a media ganancia: 50 + 40 = 90 → byte 218, sin recorte.</text></g></svg>