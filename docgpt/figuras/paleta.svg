<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Un índice no es un color RGB</title><desc id="desc">En modo 13h, imagen y paleta son recursos distintos.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Un índice no es un color RGB</text><rect x="35" y="120" width="260" height="130" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="165.0" y="156" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Píxel: índice 37</text><text x="165.0" y="188" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">un byte de memoria</text><rect x="395" y="120" width="260" height="130" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="525.0" y="156" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Paleta: entrada 37</text><text x="525.0" y="188" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">R=40, G=12, B=4</text><rect x="755" y="120" width="250" height="130" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="880.0" y="156" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Color visible</text><text x="880.0" y="188" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">interpretado por VGA</text><line x1="300" y1="185" x2="385" y2="185" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><line x1="660" y1="185" x2="745" y2="185" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="800" y="275" width="160" height="80" rx="9" fill="#a23010" stroke="none" stroke-width="2" /><text x="60" y="390" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">320 × 200 = 64000 índices; 256 × 3 = 768 componentes de paleta.</text><text x="60" y="440" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">Cambiar la entrada 37 cambia todos los píxeles que usan ese índice.</text></g></svg>