<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="510" viewBox="0 0 1040 510" role="img" aria-labelledby="title desc">
<title id="title">Cercanía: una cifra, no una ruta</title><desc id="desc">La distancia ignora las paredes; indica separación geométrica aproximada.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="510" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Cercanía: una cifra, no una ruta</text><rect x="35" y="110" width="280" height="125" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="175.0" y="146" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Separación de salidas</text><text x="175.0" y="178" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">dx=317 · dy=193</text><rect x="380" y="110" width="280" height="125" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="520.0" y="146" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Distancia aproximada</text><text x="520.0" y="178" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">317 + 193/2 = 413</text><rect x="725" y="110" width="280" height="125" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="865.0" y="146" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Normalización</text><text x="865.0" y="178" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">máximo geométrico 813</text><line x1="320" y1="172" x2="370" y2="172" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><line x1="665" y1="172" x2="715" y2="172" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><text x="520" y="325" font-size="30" fill="#148f82" text-anchor="middle" font-weight="bold">100 − floor(413 × 100 / 813) = 50</text><rect x="348" y="360" width="82" height="77" rx="9" fill="#173548" stroke="none" stroke-width="2" /><text x="389" y="414" font-size="44" fill="#ffffff" text-anchor="middle" font-weight="bold">0</text><rect x="435" y="360" width="82" height="77" rx="9" fill="#173548" stroke="none" stroke-width="2" /><text x="476" y="414" font-size="44" fill="#ffffff" text-anchor="middle" font-weight="bold">5</text><rect x="522" y="360" width="82" height="77" rx="9" fill="#173548" stroke="none" stroke-width="2" /><text x="563" y="414" font-size="44" fill="#ffffff" text-anchor="middle" font-weight="bold">0</text><rect x="609" y="360" width="82" height="77" rx="9" fill="#173548" stroke="none" stroke-width="2" /><text x="650" y="414" font-size="44" fill="#ffffff" text-anchor="middle" font-weight="bold">%</text><text x="520" y="478" font-size="21" fill="#243746" text-anchor="middle" font-weight="normal">El HUD usa pantalla. Mover solo la cámara no cambia el porcentaje.</text></g></svg>