<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Una ronda también tiene estado</title><desc id="desc">El reinicio debe distinguir datos de ronda de la puntuación acumulada.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Una ronda también tiene estado</text><rect x="30" y="150" width="210" height="115" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="135.0" y="186" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Combate</text><text x="135.0" y="218" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">movimiento + balas</text><rect x="285" y="150" width="210" height="115" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="390.0" y="186" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Impacto</text><text x="390.0" y="218" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">marcar explosión</text><rect x="540" y="150" width="210" height="115" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="645.0" y="186" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Pausa</text><text x="645.0" y="218" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">35 actualizaciones</text><rect x="795" y="150" width="210" height="115" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="900.0" y="186" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Reinicio</text><text x="900.0" y="218" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">salidas + cámara</text><line x1="245" y1="207" x2="275" y2="207" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><line x1="500" y1="207" x2="530" y2="207" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><line x1="755" y1="207" x2="785" y2="207" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><text x="70" y="360" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">La puntuación persiste. Las balas y los estados temporales se restablecen.</text><text x="70" y="425" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">El fundido del bucle oculta el salto entre el final y el nuevo comienzo.</text></g></svg>