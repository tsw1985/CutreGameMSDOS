<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Una partida: datos, reglas y presentación</title><desc id="desc">Las entradas cambian el estado compartido; imagen y sonido se derivan de ese estado.</desc>
