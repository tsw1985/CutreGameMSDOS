<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Una partida: datos, reglas y presentación</text><rect x="30" y="100" width="260" height="110" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="160.0" y="136" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Entradas</text><text x="160.0" y="168" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">teclado + IPX</text><rect x="390" y="100" width="260" height="110" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="520.0" y="136" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Simulación</text><text x="520.0" y="168" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">estado + paredes</text><rect x="750" y="100" width="260" height="110" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="880.0" y="136" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Presentación</text><text x="880.0" y="168" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">cámara + sprites</text><line x1="295" y1="155" x2="382" y2="155" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><line x1="655" y1="155" x2="742" y2="155" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="390" y="290" width="260" height="110" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="520.0" y="326" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Eventos de audio</text><text x="520.0" y="358" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">mezcla → DMA</text><line x1="520" y1="215" x2="520" y2="280" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><text x="45" y="450" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">La cámara consulta el mundo. Las reglas no dependen de lo que se ve.</text></g></svg>