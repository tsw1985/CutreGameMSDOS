<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Consultar paredes en coordenadas de mundo</title><desc id="desc">Ejemplo de movimiento desde (100,100) a (100,98), con los puntos que comprueba el tanque.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Consultar paredes en coordenadas de mundo</text><rect x="75" y="100" width="400" height="320" rx="9" fill="#e2ede8" stroke="none" stroke-width="2" /><rect x="90" y="115" width="370" height="45" rx="9" fill="#173548" stroke="none" stroke-width="2" /><rect x="200" y="180" width="48" height="216" rx="12" fill="#173548" stroke="none" stroke-width="2" /><rect x="368" y="180" width="48" height="216" rx="12" fill="#173548" stroke="none" stroke-width="2" /><rect x="248" y="216" width="120" height="156" rx="12" fill="#148f82" stroke="none" stroke-width="2" /><rect x="296" y="180" width="24" height="120" rx="0" fill="#148f82" stroke="none" stroke-width="2" /><text x="540" y="125" font-size="24" fill="#243746" text-anchor="start" font-weight="bold">Movimiento candidato hacia arriba</text><circle cx="272" cy="192" r="7" fill="#d45d46"/><text x="550" y="200" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">Cañón: (106,99)</text><circle cx="224" cy="240" r="7" fill="#d45d46"/><text x="550" y="255" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">Oruga izquierda: (102,103)</text><circle cx="368" cy="240" r="7" fill="#d45d46"/><text x="550" y="310" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">Oruga derecha: (114,103)</text><text x="70" y="460" font-size="21" fill="#243746" text-anchor="start" font-weight="normal">Tres sondas delanteras: aproximación de colisión, no prueba de toda la silueta.</text></g></svg>