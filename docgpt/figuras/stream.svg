<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Dos buffers, dos plazos diferentes</title><desc id="desc">Tener datos leídos por adelantado no autoriza a bloquear el bucle hasta agotar ese buffer.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Dos buffers, dos plazos diferentes</text><rect x="35" y="120" width="265" height="130" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="167.5" y="156" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Archivo WAV</text><text x="167.5" y="188" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">2719744 bytes de audio</text><rect x="385" y="120" width="275" height="130" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="522.5" y="156" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Buffer de canción</text><text x="522.5" y="188" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">16384 bytes · 371,52 ms</text><rect x="745" y="120" width="260" height="130" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="875.0" y="156" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">Mitad DMA</text><text x="875.0" y="188" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">2048 bytes · 46,44 ms</text><line x1="305" y1="185" x2="375" y2="185" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><line x1="665" y1="185" x2="735" y2="185" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><text x="342" y="100" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">leer</text><text x="700" y="100" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">mezclar</text><rect x="50" y="330" width="940" height="100" rx="9" fill="#f7e3db" stroke="none" stroke-width="2" /><text x="75" y="370" font-size="25" fill="#d45d46" text-anchor="start" font-weight="bold">Los 371,52 ms de canción no pasan solos al dispositivo.</text><text x="75" y="410" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">El bucle debe seguir atendiendo el mezclador dentro del plazo DMA.</text></g></svg>