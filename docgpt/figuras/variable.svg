<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
<title id="title">Un bucle transforma estado paso a paso</title><desc id="desc">El estado siguiente se calcula usando el estado actual, no la posición que imaginas en pantalla.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="500" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Un bucle transforma estado paso a paso</text><rect x="50" y="110" width="180" height="110" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="140.0" y="146" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">x = 10</text><text x="140.0" y="178" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">estado inicial</text><line x1="240" y1="165" x2="310" y2="165" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="320" y="110" width="180" height="110" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="410.0" y="146" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">x = x + 2</text><text x="410.0" y="178" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">primera vuelta</text><line x1="510" y1="165" x2="580" y2="165" stroke="#148f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="590" y="110" width="180" height="110" rx="9" fill="#eef5f4" stroke="none" stroke-width="2" /><text x="680.0" y="146" font-size="23" fill="#243746" text-anchor="middle" font-weight="bold">x = 12</text><text x="680.0" y="178" font-size="18" fill="#243746" text-anchor="middle" font-weight="normal">nuevo estado</text><text x="80" y="310" font-size="27" fill="#243746" text-anchor="start" font-weight="normal">Tras 8 vueltas:</text><text x="390" y="310" font-size="32" fill="#148f82" text-anchor="start" font-weight="bold">10 + 8 × 2 = 26</text><text x="80" y="380" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">Asignación: guardar un valor. Comparación: formular una pregunta.</text><text x="80" y="425" font-size="22" fill="#243746" text-anchor="start" font-weight="normal">El orden y el número de repeticiones forman parte del resultado.</text></g></svg>