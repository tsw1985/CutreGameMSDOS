<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
<title id="title">Zona muerta: el tanque entero debe caber</title><desc id="desc">El borde físico derecho está en 220, pero la esquina del tanque solo puede llegar a 202.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#148f82"/></marker></defs>
<rect width="1040" height="520" rx="16" fill="#f7faf9"/>
<g font-family="DejaVu Sans, sans-serif"><text x="28" y="43" font-size="26" fill="#173548" text-anchor="start" font-weight="bold">Zona muerta: el tanque entero debe caber</text><rect x="30" y="80" width="640" height="400" rx="0" fill="#e3eeeb" stroke="#173548" stroke-width="2" /><rect x="230" y="220" width="240" height="120" rx="0" fill="#c6e8dc" stroke="#148f82" stroke-width="2" /><rect x="434" y="254" width="8" height="36" rx="2" fill="#173548" stroke="none" stroke-width="2" /><rect x="462" y="254" width="8" height="36" rx="2" fill="#173548" stroke="none" stroke-width="2" /><rect x="442" y="260" width="20" height="26" rx="2" fill="#148f82" stroke="none" stroke-width="2" /><rect x="450" y="254" width="4" height="20" rx="0" fill="#148f82" stroke="none" stroke-width="2" /><line x1="230" y1="80" x2="230" y2="480" stroke="#148f82" stroke-width="2" stroke-dasharray="6 5"/><line x1="470" y1="80" x2="470" y2="480" stroke="#148f82" stroke-width="2" stroke-dasharray="6 5"/><text x="80" y="135" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">100 px</text><text x="520" y="135" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">100 px</text><text x="235" y="210" font-size="21" fill="#148f82" text-anchor="start" font-weight="normal">zona interior</text><text x="725" y="140" font-size="24" fill="#243746" text-anchor="start" font-weight="bold">Pantalla 320 × 200</text><text x="725" y="205" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">Tanque 18 × 18</text><text x="725" y="275" font-size="23" fill="#243746" text-anchor="start" font-weight="normal">Esquina permitida:</text><text x="725" y="320" font-size="27" fill="#148f82" text-anchor="start" font-weight="bold">X: 100..202</text><text x="725" y="365" font-size="27" fill="#148f82" text-anchor="start" font-weight="bold">Y: 70..112</text><text x="725" y="435" font-size="19" fill="#243746" text-anchor="start" font-weight="normal">Al sobresalir, empuja</text><text x="725" y="465" font-size="19" fill="#243746" text-anchor="start" font-weight="normal">la cámara lo justo.</text></g></svg>