# ============================================================
# Maquina B - se conecta a la A
#
#   dosbox -conf net-test/dosbox-local-b.conf
#
# Arranca SIEMPRE la A primero: la B se conecta a ella, y si el
# servidor no esta levantado todavia el connect no encuentra nada.
# ============================================================

[dosbox]
machine=svga_s3

[cpu]
core=auto
# Las dos instancias TIENEN que ir a los mismos ciclos. El lockstep
# sincroniza por frame, no por tiempo, asi que no os vais a
# desincronizar por ir a velocidades distintas: lo que pasa es que la
# rapida se pasa media vida esperando y las dos acaban yendo a la
# velocidad de la lenta. Subelo si el juego va a tirones.
cycles=fixed 30000

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5

[ipx]
# Esto es lo unico que hace falta. DOSBox NO emula una tarjeta de red:
# emula el IPX directamente, asi que no hay LSL, ni ODI, ni IPXODI, ni
# NET.CFG, ni frame types. El juego pregunta "hay IPX?" y DOSBox dice
# que si.
ipx=true

[autoexec]
mount c /home/lenovo1/DEVELOPER/MSDOS/CutreGameMSDOS
# K: separada para cada instancia. El juego escribe su log en
# k:\game.log (src/util.c), asi que con una K: compartida las dos
# copias se machacarian el log la una a la otra.
mount k /home/lenovo1/DEVELOPER/MSDOS/CutreGameMSDOS/net-test/log-b
ipxnet connect 127.0.0.1
c:
cd \bin
game.exe /net
