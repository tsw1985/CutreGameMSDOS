# ============================================================
# TWO MACHINES - this is A, the one acting as the tunnel server
#
#   dosbox -conf dosbox-red-a.conf
#
# CHANGE ONE THING in this file:
#   * the "mount c" path, if the game is somewhere else on this machine
#
# And note THIS machine's IP, which is the one to put on the other one.
# Right now it is:  192.168.1.45
# (to see it: ip -4 -br addr   on Linux,  ipconfig   on Windows)
#
# ALWAYS start this one first.
#
# Prefer ../launch_game_server.sh: it works the paths out on its own.
# ============================================================

[dosbox]
machine=svga_s3

[cpu]
core=auto
# Both instances have to run at the same cycles. Lockstep synchronises by
# frame and not by time, so you will not desync from running at different
# speeds: what happens is that the faster one spends half its life waiting
# and both end up going at the slower one's pace. Raise it if the game
# stutters.
cycles=fixed 30000

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5

[ipx]
# This is the only thing needed. DOSBox does NOT emulate a network card: it
# emulates IPX directly, so there is no LSL, no ODI, no IPXODI, no NET.CFG
# and no frame types. The game asks "is IPX there?" and DOSBox says yes.
ipx=true

[autoexec]
mount c /home/lenovo1/DEVELOPER/MSDOS/CutreGameMSDOS
# A separate K: for each instance. The game writes its log to k:\game.log
# (src/util.c), so with a shared K: the two copies would overwrite each
# other's log.
mount k /home/lenovo1/DEVELOPER/MSDOS/CutreGameMSDOS/net-test/log-a
# Brings up the tunnel. It runs over UDP on port 5213 (NOT DOSBox's default
# of 213: on Linux that one is privileged and cannot be opened by a normal
# user). If this machine has a firewall, it has to accept inbound:
#     sudo ufw allow 5213/udp
ipxnet startserver 5213
c:
cd \bin
game.exe /net
