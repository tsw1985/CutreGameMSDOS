# ============================================================
# DOS MAQUINAS - esta es la A, la que hace de servidor del tunel
#
#   dosbox -conf dosbox-red-a.conf
#
# CAMBIA UNA COSA en este fichero:
#   * la ruta del "mount c", si en esta maquina el juego no esta ahi
#
# Y apunta la IP de ESTA maquina, que es la que hay que poner en la
# otra. Ahora mismo es:  192.168.1.45
# (para verla: ip -4 -br addr   en Linux,  ipconfig   en Windows)
#
# Arranca SIEMPRE esta primero.
# ============================================================

[dosbox]
machine=svga_s3

[cpu]
core=auto
# Las dos maquinas TIENEN que ir a los mismos ciclos. El lockstep
# sincroniza por frame, no por tiempo, asi que no os vais a
# desincronizar por ir a distinta velocidad: lo que pasa es que la
# rapida se pasa media vida esperando a la lenta.
cycles=fixed 30000

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5

[ipx]
# DOSBox NO emula una tarjeta de red: emula el IPX directamente. No hay
# LSL, ni ODI, ni IPXODI, ni NET.CFG, ni frame types. Nada que instalar.
ipx=true

[autoexec]
mount c /home/lenovo1/DEVELOPER/MSDOS/CutreGameMSDOS
mount k /home/lenovo1/DEVELOPER/MSDOS/CutreGameMSDOS/net-test/log-a
# Levanta el tunel. Va por UDP, puerto 213: si esta maquina tiene
# cortafuegos, tiene que aceptar entrante en ese puerto.
ipxnet startserver
c:
cd \bin
game.exe /net
